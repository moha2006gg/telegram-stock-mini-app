<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>UV Printing</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --danger: var(--tg-theme-destructive-text-color, #e5484d);
    --ok: #2e9d58;
    --sep: var(--tg-theme-section-separator-color, rgba(128, 128, 128, 0.18));
    --field: var(--tg-theme-bg-color, #ffffff);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-tg]) {
      --bg: #0f0f10; --card: #1c1c1e; --text: #f2f2f2; --hint: #8e8e93; --field: #2c2c2e;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding: 12px 16px calc(84px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); margin: 22px 4px 8px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 14px 16px; }
  .hero { text-align: center; padding: 22px 16px 18px; }
  .hero .label { color: var(--hint); font-size: 14px; }
  .hero .big { font-size: 34px; font-weight: 700; letter-spacing: -.02em; margin: 4px 0 14px; font-variant-numeric: tabular-nums; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .split > div { background: var(--bg); border-radius: 10px; padding: 8px 10px; }
  .split .k { font-size: 12px; color: var(--hint); }
  .split .v { font-weight: 600; font-variant-numeric: tabular-nums; }
  .pos { color: var(--ok); } .neg { color: var(--danger); }
  .list { background: var(--card); border-radius: var(--radius); overflow: hidden; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--sep); }
  .row:last-child { border-bottom: 0; }
  .row .main { min-width: 0; }
  .row .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub { font-size: 13px; color: var(--hint); }
  .row .amt { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .empty { padding: 14px 16px; color: var(--hint); font-size: 14px; }
  label { display: block; font-size: 13px; color: var(--hint); margin: 12px 2px 6px; }
  input {
    width: 100%; font: inherit; color: var(--text); background: var(--field);
    border: 1px solid var(--sep); border-radius: 10px; padding: 11px 12px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--sep); background: var(--field); color: var(--text);
    border-radius: 999px; padding: 8px 12px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .chip small { color: var(--hint); margin-left: 4px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .chip.on small { color: var(--accent-text); opacity: .8; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border-radius: 12px; padding: 4px; gap: 4px; }
  .seg button { border: 0; background: transparent; color: var(--text); font: inherit; font-weight: 500; padding: 9px; border-radius: 9px; cursor: pointer; }
  .seg button.on { background: var(--accent); color: var(--accent-text); }
  .toggle { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
  .toggle input { width: auto; transform: scale(1.3); }
  .calc { margin-top: 16px; }
  .calc .line { display: flex; justify-content: space-between; padding: 3px 0; font-variant-numeric: tabular-nums; }
  .calc .line.total { font-size: 20px; font-weight: 700; border-top: 1px solid var(--sep); margin-top: 6px; padding-top: 8px; }
  .btn {
    display: block; width: 100%; margin-top: 16px; border: 0; border-radius: 12px; padding: 14px;
    font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  .btn.secondary { background: var(--card); color: var(--accent); border: 1px solid var(--sep); }
  .btn:disabled { opacity: .55; }
  pre.preview {
    margin: 0; white-space: pre-wrap; word-break: break-word; font: 14px/1.45 ui-monospace, Menlo, monospace;
  }
  .topbar { display: flex; justify-content: space-between; align-items: center; }
  .topbar h1 { font-size: 22px; margin: 4px 4px 12px; }
  .icon-btn { border: 0; background: none; color: var(--accent); font: inherit; font-size: 15px; padding: 6px; cursor: pointer; }
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--card); border-top: 1px solid var(--sep); padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .tabs button {
    border: 0; background: none; color: var(--hint); font: inherit; font-size: 12px; font-weight: 500;
    padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;
  }
  .tabs button svg { width: 24px; height: 24px; }
  .tabs button.on { color: var(--accent); }
  .page { display: none; } .page.on { display: block; }
  .toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom));
    padding: 12px 14px; border-radius: 12px; color: #fff; font-weight: 500; text-align: center;
    transform: translateY(20px); opacity: 0; transition: .2s; pointer-events: none;
  }
  .toast.show { transform: none; opacity: 1; }
  .toast.ok { background: var(--ok); } .toast.err { background: var(--danger); }
  .notice { text-align: center; color: var(--hint); padding: 40px 10px; }
  .skeleton { color: transparent !important; background: var(--sep); border-radius: 6px; }
</style>
</head>
<body>

<section class="page on" id="p-home">
  <div class="topbar"><h1>UV Printing</h1><button class="icon-btn" id="refresh">Actualiser</button></div>
  <div class="card hero">
    <div class="label">Solde net</div>
    <div class="big" id="net">—</div>
    <div class="split">
      <div><div class="k">Profits</div><div class="v pos" id="profits">—</div></div>
      <div><div class="k">Pertes</div><div class="v neg" id="losses">—</div></div>
    </div>
  </div>
  <h2>Derniers devis</h2><div class="list" id="quotes"><div class="empty">Chargement…</div></div>
  <h2>Derniers profits</h2><div class="list" id="profit-list"><div class="empty">Chargement…</div></div>
  <h2>Dernières pertes</h2><div class="list" id="loss-list"><div class="empty">Chargement…</div></div>
</section>

<section class="page" id="p-devis">
  <div class="topbar"><h1>Nouveau devis</h1></div>
  <form class="card" id="f-devis" autocomplete="off">
    <label for="d-client">Client</label>
    <input id="d-client" name="client" required>
    <div class="grid2">
      <div><label for="d-width">Largeur (cm)</label><input id="d-width" name="width" inputmode="decimal" required></div>
      <div><label for="d-height">Hauteur (cm)</label><input id="d-height" name="height" inputmode="decimal" required></div>
    </div>
    <label for="d-qty">Quantité</label>
    <input id="d-qty" name="qty" inputmode="numeric" value="1" required>
    <label>Type d'impression</label>
    <div class="chips" id="d-types"></div>
    <div class="toggle"><span>Produit complet (avec matériau)</span><input type="checkbox" id="d-complete"></div>
    <div id="d-material-wrap" hidden>
      <label for="d-material">Coût matériau par article (DA)</label>
      <input id="d-material" name="material" inputmode="decimal">
    </div>
    <div class="calc">
      <div class="line"><span>Surface</span><span id="c-surface">—</span></div>
      <div class="line"><span>Prix par article</span><span id="c-article">—</span></div>
      <div class="line total"><span>Total</span><span id="c-total">—</span></div>
    </div>
    <button class="btn" type="submit">Enregistrer le devis</button>
  </form>
</section>

<section class="page" id="p-entry">
  <div class="topbar"><h1>Saisie</h1></div>
  <div class="seg" id="e-seg">
    <button type="button" data-kind="profit" class="on">Profit</button>
    <button type="button" data-kind="perte">Perte</button>
    <button type="button" data-kind="ajuster">Ajuster</button>
  </div>
  <form class="card" id="f-entry" autocomplete="off" style="margin-top:12px">
    <label for="e-name" id="e-name-label">Client</label>
    <input id="e-name" required>
    <label for="e-amount" id="e-amount-label">Montant (DA)</label>
    <input id="e-amount" inputmode="decimal" required>
    <p class="sub" id="e-help" style="color:var(--hint);font-size:13px;margin:10px 2px 0"></p>
    <button class="btn" type="submit" id="e-submit">Ajouter le profit</button>
  </form>
</section>

<section class="page" id="p-msg">
  <div class="topbar"><h1>Message client</h1></div>
  <form class="card" id="f-msg" autocomplete="off">
    <label for="m-client">Destinataire</label>
    <input id="m-client" required>
    <label for="m-amount">Montant (DA)</label>
    <input id="m-amount" inputmode="decimal" required>
    <label for="m-ref">Référence</label>
    <input id="m-ref" placeholder="ex : Impression UV boîtes" required>
  </form>
  <h2>Aperçu</h2>
  <div class="card"><pre class="preview" id="m-preview"></pre></div>
  <button class="btn" type="button" id="m-send">Envoyer dans le chat pour transférer</button>
  <button class="btn secondary" type="button" id="m-copy">Copier le message</button>
</section>

<nav class="tabs">
  <button data-page="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
  <button data-page="devis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>Devis</button>
  <button data-page="entry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Saisie</button>
  <button data-page="msg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4z"/></svg>Message</button>
</nav>

<div class="toast" id="toast"></div>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    document.documentElement.setAttribute('data-tg', '');
    tg.ready();
    tg.expand();
  }

  const $ = (id) => document.getElementById(id);
  const num = (v) => parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.'));
  const nf = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 2 });
  const da = (v) => {
    const n = num(v);
    return Number.isFinite(n) ? nf.format(n) + ' DA' : '—';
  };

  let tariffs = {};
  let selectedType = null;

  const haptic = (kind) => tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(kind);

  let toastTimer;
  function toast(text, ok = true) {
    const el = $('toast');
    el.textContent = text;
    el.className = 'toast show ' + (ok ? 'ok' : 'err');
    haptic(ok ? 'success' : 'error');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (el.className = 'toast'), 2600);
  }

  async function api(action, data = {}) {
    const res = await fetch('/api/app', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: tg ? tg.initData : '', action, ...data }),
    });
    const json = await res.json().catch(() => ({ error: 'Erreur ' + res.status }));
    if (!res.ok || json.error) throw new Error(json.error || 'Erreur ' + res.status);
    return json;
  }

  async function withBusy(button, fn) {
    const label = button.textContent;
    button.disabled = true;
    button.textContent = 'Patientez…';
    try {
      return await fn();
    } finally {
      button.disabled = false;
      button.textContent = label;
    }
  }

  // ─── Navigation ───────────────────────────────────────
  document.querySelectorAll('.tabs button').forEach((b) =>
    b.addEventListener('click', () => {
      document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
      document.querySelectorAll('.page').forEach((p) => p.classList.toggle('on', p.id === 'p-' + b.dataset.page));
      tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged();
      window.scrollTo(0, 0);
    })
  );

  // ─── Accueil ──────────────────────────────────────────
  function row(title, sub, amount, cls) {
    const r = document.createElement('div');
    r.className = 'row';
    const main = document.createElement('div');
    main.className = 'main';
    const t = document.createElement('div');
    t.className = 'title';
    t.textContent = title;
    main.appendChild(t);
    if (sub) {
      const s = document.createElement('div');
      s.className = 'sub';
      s.textContent = sub;
      main.appendChild(s);
    }
    const a = document.createElement('div');
    a.className = 'amt' + (cls ? ' ' + cls : '');
    a.textContent = amount;
    r.append(main, a);
    return r;
  }

  function fill(listId, rows) {
    const el = $(listId);
    el.replaceChildren(...(rows.length ? rows : [Object.assign(document.createElement('div'), { className: 'empty', textContent: 'Rien pour l’instant' })]));
  }

  async function loadSummary() {
    try {
      const s = await api('summary');
      $('net').textContent = da(s.balance.net);
      $('net').className = 'big ' + (s.balance.net < 0 ? 'neg' : '');
      $('profits').textContent = da(s.balance.profits);
      $('losses').textContent = da(s.balance.losses);
      fill('quotes', s.quotes.map((q) => row(q.client, `${q.width}×${q.height} cm · ×${q.qty} · ${q.type}`, da(q.total))));
      fill('profit-list', s.profits.map((p) => row(p.client, p.adjusted ? 'Ajusté (devis ' + da(p.devis) + ')' : '', '+' + da(p.profit), 'pos')));
      fill('loss-list', s.losses.map((l) => row(l.description || '—', '', '−' + da(l.amount), 'neg')));
      if (Object.keys(tariffs).length === 0) {
        tariffs = s.tariffs;
        renderTypes();
      }
    } catch (err) {
      toast(err.message, false);
      ['quotes', 'profit-list', 'loss-list'].forEach((id) =>
        fill(id, [Object.assign(document.createElement('div'), { className: 'empty', textContent: err.message })])
      );
    }
  }
  $('refresh').addEventListener('click', (e) => withBusy(e.currentTarget, loadSummary));

  // ─── Devis ────────────────────────────────────────────
  function renderTypes() {
    const wrap = $('d-types');
    wrap.replaceChildren();
    Object.entries(tariffs).forEach(([name, rate]) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (name === selectedType ? ' on' : '');
      b.append(name);
      const small = document.createElement('small');
      small.textContent = nf.format(rate) + '/m²';
      b.appendChild(small);
      b.addEventListener('click', () => {
        selectedType = name;
        renderTypes();
        calc();
        tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged();
      });
      wrap.appendChild(b);
    });
  }

  function calc() {
    const w = num($('d-width').value), h = num($('d-height').value), q = parseInt($('d-qty').value, 10);
    const rate = tariffs[selectedType];
    const complete = $('d-complete').checked;
    const material = complete ? num($('d-material').value) || 0 : 0;
    if (!(w > 0 && h > 0)) {
      $('c-surface').textContent = $('c-article').textContent = $('c-total').textContent = '—';
      return;
    }
    const surface = (w * h) / 10000;
    $('c-surface').textContent = surface.toLocaleString('fr-FR', { maximumFractionDigits: 4 }) + ' m²';
    if (!rate) {
      $('c-article').textContent = $('c-total').textContent = 'Choisir un type';
      return;
    }
    const article = material + surface * rate;
    $('c-article').textContent = da(article);
    $('c-total').textContent = q > 0 ? da(article * q) : '—';
  }

  ['d-width', 'd-height', 'd-qty', 'd-material'].forEach((id) => $(id).addEventListener('input', calc));
  $('d-complete').addEventListener('change', () => {
    $('d-material-wrap').hidden = !$('d-complete').checked;
    calc();
  });

  $('f-devis').addEventListener('submit', (e) => {
    e.preventDefault();
    if (!selectedType) return toast('Choisissez un type d’impression', false);
    const btn = e.currentTarget.querySelector('button[type=submit]');
    withBusy(btn, async () => {
      try {
        const q = await api('devis', {
          client: $('d-client').value,
          width: $('d-width').value,
          height: $('d-height').value,
          qty: $('d-qty').value,
          type: selectedType,
          complete: $('d-complete').checked,
          material: $('d-material').value,
        });
        toast('Devis enregistré : ' + da(q.total));
        e.target.reset();
        $('d-qty').value = '1';
        $('d-material-wrap').hidden = true;
        selectedType = null;
        renderTypes();
        calc();
        loadSummary();
      } catch (err) {
        toast(err.message, false);
      }
    });
  });

  // ─── Saisie : profit / perte / ajuster ────────────────
  const entryKinds = {
    profit: { name: 'Client', amount: 'Montant (DA)', submit: 'Ajouter le profit', help: '', ok: 'Profit ajouté' },
    perte: { name: 'Description', amount: 'Montant (DA)', submit: 'Ajouter la perte', help: 'Encre, vernis, matériau…', ok: 'Perte ajoutée' },
    ajuster: { name: 'Client', amount: 'Montant reçu (DA)', submit: 'Ajuster le paiement', help: 'Remplace le montant du devis le plus récent de ce client.', ok: 'Paiement ajusté' },
  };
  let entryKind = 'profit';
  function setKind(kind) {
    entryKind = kind;
    const k = entryKinds[kind];
    document.querySelectorAll('#e-seg button').forEach((b) => b.classList.toggle('on', b.dataset.kind === kind));
    $('e-name-label').textContent = k.name;
    $('e-amount-label').textContent = k.amount;
    $('e-submit').textContent = k.submit;
    $('e-help').textContent = k.help;
  }
  document.querySelectorAll('#e-seg button').forEach((b) => b.addEventListener('click', () => setKind(b.dataset.kind)));

  $('f-entry').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = $('e-name').value;
    const amount = $('e-amount').value;
    const payload = entryKind === 'perte' ? { description: name, amount } : { client: name, amount };
    withBusy($('e-submit'), async () => {
      try {
        await api(entryKind, payload);
        toast(entryKinds[entryKind].ok + ' : ' + da(amount));
        e.target.reset();
        loadSummary();
      } catch (err) {
        toast(err.message, false);
      }
    });
  });

  // ─── Message client ───────────────────────────────────
  function paymentMessage() {
    const date = new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
    const line = '━'.repeat(22);
    return (
      `${line}\n  CONFIRMATION DE PAIEMENT\n${line}\n\n` +
      `Destinataire : ${$('m-client').value.trim() || '…'}\n` +
      `Montant : ${da($('m-amount').value)}\n` +
      `Ref : ${$('m-ref').value.trim() || '…'}\n` +
      `Date : ${date}\n\n` +
      `Merci de confirmer la reception.\n${line}`
    );
  }
  const renderPreview = () => ($('m-preview').textContent = paymentMessage());
  ['m-client', 'm-amount', 'm-ref'].forEach((id) => $(id).addEventListener('input', renderPreview));
  renderPreview();

  const msgValid = () => {
    if ($('f-msg').reportValidity() && num($('m-amount').value) > 0) return true;
    toast('Remplissez destinataire, montant et référence', false);
    return false;
  };

  $('m-send').addEventListener('click', (e) => {
    if (!msgValid()) return;
    withBusy(e.currentTarget, async () => {
      try {
        await api('envoyer', { client: $('m-client').value, amount: $('m-amount').value, reference: $('m-ref').value });
        toast('Envoyé dans le chat');
        setTimeout(() => tg && tg.close(), 700);
      } catch (err) {
        toast(err.message, false);
      }
    });
  });

  $('m-copy').addEventListener('click', async () => {
    if (!msgValid()) return;
    const text = paymentMessage();
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast('Message copié');
  });

  // ─── Start ────────────────────────────────────────────
  if (!tg || !tg.initData) {
    document.body.innerHTML = '<div class="notice">Ouvrez cette page depuis le bot Telegram.</div>';
    return;
  }
  loadSummary();
})();
</script>
</body>
</html>
