<!doctype html>
<html>
<head><meta charset="utf-8"><title>3D Viewer</title></head>
<body>
  <model-viewer id="m" style="width:100%;height:80vh" camera-controls auto-rotate></model-viewer>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const model = params.get('model');
    if(model) document.getElementById('m').src = model;
  </script>
</body>
</html>
